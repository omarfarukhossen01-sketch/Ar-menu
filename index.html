<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
  <a-scene vr-mode-ui="enabled: false" embedded>

    <!-- Camera -->
    <a-entity camera look-controls position="0 1.6 0"></a-entity>

    <!-- Clickable Plane (table simulation) -->
    <a-plane id="ground" rotation="-90 0 0" width="10" height="10" color="#ccc"></a-plane>

    <!-- Burger Model -->
    <a-entity 
      id="burger"
      gltf-model="back_yard_burgers_-_classic_burger.glb"
      scale="2 2 2"
      visible="false">
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("click", function (e) {
      const burger = document.querySelector("#burger");
      burger.setAttribute("position", "0 0 -3");
      burger.setAttribute("visible", "true");
    });
  </script>
</body>
</html>
